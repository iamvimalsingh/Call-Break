<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="feltBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#02140f" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="goldSpade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#feltBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldBorder)" stroke-width="4" opacity="0.65" />
  <rect width="480" height="480" x="16" y="16" rx="98" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Center Card Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Spade Icon -->
    <path
      d="M256,96 C240,150 156,230 156,290 C156,334 190,364 232,364 C250,364 266,356 276,342 C266,380 248,406 220,422 L292,422 C264,406 246,380 236,342 C246,356 262,364 280,364 C322,364 356,334 356,290 C356,230 272,150 256,96 Z"
      fill="url(#goldSpade)"
    />
  </g>

  <!-- Crown / Star Accents -->
  <circle cx="256" cy="140" r="6" fill="#fef08a" opacity="0.9" filter="url(#glow)" />
  <circle cx="178" cy="275" r="4" fill="#fef08a" opacity="0.75" />
  <circle cx="334" cy="275" r="4" fill="#fef08a" opacity="0.75" />

  <!-- Lakdi / Call Break Emblem Text -->
  <text x="256" y="465" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6" fill="#fde047" opacity="0.95">CALL BREAK</text>
</svg>
